<!doctype html>
<html lang="en">
  <head>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Memo" />

    <link rel="canonical" href="https://memo.aossie.org/" />

    <link rel="icon" href="./memo-logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />

    <meta property="og:title" content="Memo – Find the pairs" />

      property="og:description"
      content="A free memory card game for children: find the pairs and learn shapes, colours and the capitals of the world, or make your own cards. Works offline, no account, no ads, no tracking."

    <meta name="twitter:title" content="Memo – Find the pairs" />

      name="twitter:description"
      content="A free memory card game for children: find the pairs and learn shapes, colours and the capitals of the world, or make your own cards. Works offline, no account, no ads, no tracking."

    <meta name="twitter:image" content="https://memo.aossie.org/og-image.png" />
